name: Branch-constrained high-resolution IPM crosscheck
on:
  push:
    branches:
      - validation/2026-11-05-independent-audit
  workflow_dispatch:
jobs:
  higher-resolution:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install scientific dependencies
        run: python -m pip install --disable-pip-version-check numpy scipy numba
      - name: Run two levels of mesh refinement with branch constraint
        run: |
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          python -u validation/seeded_global_highres.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seeded-global-highres-results
          path: validation/seeded_global_highres_results.json
          if-no-files-found: warn
