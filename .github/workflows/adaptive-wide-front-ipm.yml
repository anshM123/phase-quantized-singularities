name: Wide-front IPM adaptive convergence test
on:
  push:
    branches:
      - validation/2026-11-05-wide-front
  workflow_dispatch:
jobs:
  wide-front-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical packages
        run: python -m pip install --disable-pip-version-check numpy scipy numba
      - name: Refine the wider stalled-flow domain
        run: |
          export OPENBLAS_NUM_THREADS=1
          export OMP_NUM_THREADS=1
          python - <<'PY'
          from pathlib import Path
          p=Path("validation/adaptive_global_ipm.py")
          s=p.read_text()
          assert s.count("hfar=.15,sigma=.7")==2
          assert "cases=[(.025,32),(.0125,32),(.00625,32),(.00625,40)]" in s
          s=s.replace("hfar=.15,sigma=.7","hfar=.075,sigma=1.5")
          s=s.replace("cases=[(.025,32),(.0125,32),(.00625,32),(.00625,40)]",
                      "cases=[(.0125,32),(.00625,32),(.00625,40)]")
          p.write_text(s)
          PY
          python -u validation/adaptive_global_ipm.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wide-front-ipm-results
          path: validation/adaptive_results.json
          if-no-files-found: warn
